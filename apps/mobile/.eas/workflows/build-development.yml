name: Build development clients

on:
  workflow_dispatch: {}

defaults:
  image: sdk-57
  run:
    working_directory: ../..

jobs:
  quality:
    name: Workspace quality gates
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck, lint, test, and architecture checks
        run: corepack pnpm quality
      - name: Repository hygiene
        run: corepack pnpm check:repository

  build_android:
    name: Android development client
    needs: [quality]
    type: build
    params:
      platform: android
      profile: development

  build_ios:
    name: iOS development client
    needs: [quality]
    type: build
    params:
      platform: ios
      profile: development
