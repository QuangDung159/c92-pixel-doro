name: Publish preview update

on:
  workflow_dispatch:

defaults:
  image: sdk-57
  run:
    working_directory: ../..

jobs:
  quality:
    name: Workspace quality gates
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck, lint, test, and architecture checks
        run: corepack pnpm quality
      - name: Repository hygiene
        run: corepack pnpm check:repository

  publish_preview:
    name: Publish preview channel
    needs: [quality]
    type: update
    environment: preview
    params:
      channel: preview

